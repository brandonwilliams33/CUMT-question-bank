<body><header class="top"><a href="#" class="brand"><span class="brand-icon">矿</span><span>课程练习室<small>中国矿业大学 · 学生自建</small></span></a><div class="tools"><span class="save-status" id="saveStatus">本机记录已开启</span><button id="theme" class="quiet" aria-label="切换深色模式">深色</button><button id="settings" class="quiet">记录管理</button></div></header>

<dialog id="records"><div class="dialog-head"><h2>本机学习记录</h2><button id="closeRecords" class="quiet">关闭</button></div><p>答题记录、错题、收藏与练习位置保存在这台设备的当前浏览器中。更换浏览器、清理网站数据或使用无痕模式，可能导致记录丢失。不会自动跨设备同步。</p><div class="record-actions"><button id="export">导出备份</button><label class="button secondary" for="import">导入备份</label><input id="import" type="file" accept="application/json,.json" hidden></div><p class="muted">导入会替换当前记录，请先导出备份。备份文件不包含个人身份信息。</p><hr><button id="reset" class="danger">清空本机全部记录</button></dialog>
